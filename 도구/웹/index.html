<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원래 어디서?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1 class="mark">원래 어디서?</h1>
    <p class="lede">기사에 나온 숫자를 넣으면, 그 숫자가 처음 나온 보고서의 쪽과 문장을 찾아 나란히 보여 줍니다.</p>
  </header>

  <main>
    <form id="ask" class="ask" autocomplete="off">
      <label for="sentence" class="field-name">기사 문장</label>
      <textarea id="sentence" rows="3" required
        placeholder="예) 국가데이터처가 발표한 9월 산업활동동향에 따르면 전산업생산은 전월보다 3.0% 증가했다."></textarea>

      <label for="url" class="field-name">기사 주소 <span class="hint">(선택) 넣으면 기사 제목·날짜·앞뒤 문단을 자동으로 읽습니다</span></label>
      <input id="url" type="url" placeholder="https://...">

      <details class="more">
        <summary>기사 제목·앞뒤 문단, 날짜 더하기 <span class="hint">문장에 기관 이름이 없을 때</span></summary>
        <label for="context" class="field-name">기사 제목·앞뒤 문단</label>
        <textarea id="context" rows="3" placeholder="기사 제목이나 숫자 앞뒤 문단을 붙여 넣으세요."></textarea>
        <label for="date" class="field-name">기사 날짜</label>
        <input id="date" type="date">
      </details>

      <div class="ask-row">
        <button type="submit" id="go">원문 찾기</button>
        <p class="samples">써 보기:
          <button type="button" class="sample" data-s="국가데이터처가 발표한 9월 산업활동동향에 따르면 전산업생산은 전월보다 3.0% 증가해 15년 6개월 만에 최대 증가폭을 기록했다." data-d="2026-10-30">산업활동동향 3.0%</button>
          <button type="button" class="sample" data-s="국가데이터처의 경제활동인구조사 근로형태별 부가조사에 따르면 정규직과 비정규직 근로자의 월평균 임금 격차는 194만원으로 역대 최대를 기록했다." data-d="2026-10-21">임금 격차 194만원</button>
          <button type="button" class="sample" data-s="한국보건사회연구원 보고서에 따르면 상급종합병원과 종합병원 중 43%가 보안관제를 실시하지 않는 것으로 나타났다." data-d="2026-10-13">병원 보안관제 43%</button>
        </p>
      </div>
      <p class="note">어느 기관 숫자든 그 기관 공식 누리집에서 원문을 찾아 대조합니다. 찾지 못하면 이유와 확인할 곳을 알려 줍니다.</p>
    </form>

    <section id="progress" class="progress" hidden aria-live="polite">
      <p class="progress-head"><span id="elapsed">0초</span> 원문을 찾고 있습니다</p>
      <table id="stages-table" class="summary stages" hidden><caption>지금까지 찾은 것</caption><tbody id="stages"></tbody></table>
      <ol id="steps"></ol>
    </section>

    <p id="error" class="error" hidden role="alert"></p>

    <section id="result" class="result" hidden></section>
  </main>

  <footer class="foot">
    검색·판정: Liner Search API, Liner 모델(라우터·게이트웨이). 원문은 각 기관 누리집의 공개 자료입니다.
  </footer>
  <script src="/app.js"></script>
</body>
</html>
